<section class="dubbing-section">

  <div class="dubbing-card">

    <div class="dubbing-icon">🌎</div>

    <h2>Traduzir e Dublar Vídeo</h2>

    <p>
      Cole o link do vídeo ou envie um vídeo do seu celular.
    </p>

    <label for="videoUrl">🔗 Link do vídeo</label>

    <div class="url-box">
      <input
        type="url"
        id="videoUrl"
        placeholder="Cole aqui o link do vídeo..."
        autocomplete="off"
      />

      <button id="previewUrlButton" type="button">
        Ver vídeo
      </button>
    </div>

    <div id="videoPreview" class="video-preview">
      <p>O vídeo aparecerá aqui.</p>
    </div>

    <div class="language-grid">

      <div>
        <label for="sourceLanguage">
          🌐 Idioma original
        </label>

        <select id="sourceLanguage">
          <option value="auto">Detectar automaticamente</option>
          <option value="pt-BR">Português</option>
          <option value="en">Inglês</option>
          <option value="es">Espanhol</option>
          <option value="fr">Francês</option>
          <option value="de">Alemão</option>
          <option value="it">Italiano</option>
          <option value="ja">Japonês</option>
          <option value="ko">Coreano</option>
          <option value="zh">Chinês</option>
        </select>
      </div>

      <div>
        <label for="targetLanguage">
          🗣️ Dublar para
        </label>

        <select id="targetLanguage">
          <option value="pt-BR">Português 🇧🇷</option>
          <option value="en">Inglês 🇺🇸</option>
          <option value="es">Espanhol 🇪🇸</option>
          <option value="fr">Francês 🇫🇷</option>
          <option value="de">Alemão 🇩🇪</option>
          <option value="it">Italiano 🇮🇹</option>
          <option value="ja">Japonês 🇯🇵</option>
          <option value="ko">Coreano 🇰🇷</option>
          <option value="zh">Chinês 🇨🇳</option>
        </select>
      </div>

    </div>

    <button
      id="dubVideoButton"
      class="dub-button"
      type="button"
    >
      🎙️ Traduzir e Dublar
    </button>

    <div id="dubStatus" class="dub-status"></div>

  </div>

</section>
