<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keep - Tradutor Universal</title>

  <meta
    name="description"
    content="Keep - Tradutor Universal com tradução de áudio em tempo real."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #172554 0%, #020617 45%, #000 100%);
      color: #fff;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      padding: 22px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2,6,23,.82);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .logo span {
      color: #38bdf8;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #a7f3d0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
    }

    /* HERO */

    .hero {
      padding: 70px 0 45px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(56,189,248,.1);
      border: 1px solid rgba(56,189,248,.25);
      color: #7dd3fc;
      font-size: 13px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 span {
      color: #38bdf8;
    }

    .subtitle {
      max-width: 720px;
      margin: auto;
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.7;
    }

    /* APP */

    .app-card {
      margin: 35px auto 70px;
      max-width: 900px;
      background: rgba(15,23,42,.82);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    .video-box {
      min-height: 300px;
      border-radius: 18px;
      background: #020617;
      border: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #94a3b8;
      padding: 25px;
    }

    .video-box h3 {
      color: #fff;
      margin-bottom: 10px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .control-btn {
      border: 0;
      padding: 15px;
      border-radius: 13px;
      background: #1e293b;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      transition: .2s;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      background: #334155;
    }

    .translation-box {
      margin-top: 18px;
      background: #020617;
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(56,189,248,.18);
    }

    .translation-title {
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #translationText {
      color: #e2e8f0;
      line-height: 1.6;
      min-height: 50px;
    }

    /* PRICING */

    .pricing {
      padding: 20px 0 80px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #94a3b8;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      max-width: 900px;
      margin: auto;
    }

    .plan {
      background: rgba(15,23,42,.9);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .plan.featured {
      border-color: #38bdf8;
      box-shadow: 0 0 35px rgba(56,189,248,.12);
    }

    .recommended {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 11px;
      background: #38bdf8;
      color: #082f49;
      padding: 6px 9px;
      border-radius: 999px;
      font-weight: 800;
    }

    .plan h3 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 44px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .price small {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 400;
    }

    .features {
      list-style: none;
      margin: 25px 0;
    }

    .features li {
      padding: 9px 0;
      color: #cbd5e1;
    }

    .features li::before {
      content: "✓";
      color: #22c55e;
      font-weight: bold;
      margin-right: 9px;
    }

    .pay-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 16px;
      background: #38bdf8;
      color: #082f49;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
    }

    .pay-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .pay-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .secure {
      text-align: center;
      margin-top: 12px;
      color: #64748b;
      font-size: 12px;
    }

    /* MENSAGEM */

    #paymentMessage {
      display: none;
      max-width: 700px;
      margin: 25px auto;
      padding: 18px;
      border-radius: 15px;
      text-align: center;
      line-height: 1.5;
    }

    #paymentMessage.success {
      display: block;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.3);
      color: #86efac;
    }

    #paymentMessage.error {
      display: block;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 30px 0;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }

    /* RESPONSIVO */

    @media (max-width: 700px) {

      .hero {
        padding-top: 45px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .plans {
        grid-template-columns: 1fr;
      }

      .app-card {
        padding: 15px;
      }

      .video-box {
        min-height: 230px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="container nav">

      <div class="logo">
        Keep<span>.</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Sistema online
      </div>

    </div>
  </header>


  <!-- HERO -->

  <main>

    <section class="hero">

      <div class="container">

        <div class="badge">
          TRADUÇÃO INTELIGENTE COM IA
        </div>

        <h1>
          Keep <span>Tradutor Universal</span>
        </h1>

        <p class="subtitle">
          Traduza conteúdos, vídeos e áudios para outros idiomas
          utilizando inteligência artificial.
        </p>

      </div>
